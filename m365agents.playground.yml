# yaml-language-server: $schema=https://aka.ms/m365-agents-toolkits/v1.11/yaml.schema.json
# Visit https://aka.ms/teamsfx-v5.0-guide for details on this file
# Visit https://aka.ms/teamsfx-actions for details on actions
version: v1.11

deploy:
  # Install development tool(s)
  - uses: devTool/install
    with:
      testTool:
        version: ~0.2.1
        symlinkDir: ./devTools/playground
      nodejs:
        symlinkDir: ./devTools/nodejs

  # Generate runtime environment variables
  - uses: file/createOrUpdateEnvironmentFile
    with:
      target: ./.env
      envs:
        TEAMSFX_ENV: "playground"
        CLIENT_ID: ""
        CLIENT_SECRET: ""
        TENANT_ID: ""
        BOT_SKIP_AUTH: "true"
        DATABASE_URL: "sqlite+pysqlite:///:memory:"
        LLM_PRIMARY: "groq"
        # Playground has no Graph/D365 credentials; expose only task lifecycle tools.
        LLM_TOOL_PROFILE: "groq_chat"
        OPENAI_API_KEY: ${{SECRET_OPENAI_API_KEY}}
        GROQ_API_KEY: ${{SECRET_GROQ_API_KEY}}
        GROQ_MODEL: "openai/gpt-oss-120b"
        GROQ_FALLBACK_MODEL: "qwen/qwen3.6-27b"
        NOTIFICATION_ACTIVITY_ENABLED: "false"
        NOTIFICATION_BOT_DM_ENABLED: "false"
